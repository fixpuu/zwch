    let scrollDepths = [25, 50, 75, 90];
    let fired = {};
    window.addEventListener('scroll', () => {
      const pct = Math.round((window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100);
      scrollDepths.forEach(d => {
        if (pct >= d && !fired[d]) {
          fired[d] = true;
          gtag('event', 'scroll_depth', { depth_percentage: d });
        }
      });
    });
  </script>

  <script>
    // Setup for product.html logic
    let currentPageProductId = null;
    
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if(!id) {
        document.getElementById('product-page-title').textContent = "Product Not Found";
        return;
      }
      currentPageProductId = parseInt(id);
      
      try {
        const res = await fetch('https://bot.zwch.store/api/shop/products');
        const json = await res.json();
        const product = json.data.find(p => p.id === currentPageProductId);
        
        if(!product) throw new Error("Not found");
        
        const stock = product.stock_count || 0;
        const price = `€${(product.price_cents / 100).toFixed(2)}`;
        const isOut = stock === 0;
        const isLow = !isOut && stock <= 3;
        
        document.getElementById('product-page-title').textContent = product.name;
        document.getElementById('product-page-price').textContent = price;
        
        // Preserve line breaks for description, allow emojis (as per prompt)
        let descHtml = (product.description || "").replace(/\n/g, '<br/>');
        // Instructions too
        if(product.instructions) {
           descHtml += "<br/><br/><strong>Instructions:</strong><br/>" + product.instructions.replace(/\n/g, '<br/>');
        }
        document.getElementById('product-page-desc').innerHTML = descHtml;
        
        const badge = document.getElementById('product-page-badge');
        if(isOut) {
          badge.textContent = "Sold Out";
          badge.className = "card-clarity-badge product-card__stock--out";
          document.getElementById('btn-buy-product').disabled = true;
          document.getElementById('btn-buy-product').textContent = "Sold Out";
        } else if(isLow) {
          badge.textContent = `Only ${stock} left`;
          badge.className = "card-clarity-badge product-card__stock--low";
        } else {
          badge.textContent = `${stock} in stock`;
          badge.className = "card-clarity-badge product-card__stock--available";
        }
        
      } catch (err) {
        document.getElementById('product-page-title').textContent = "Product Not Found";
      }
    });
    
    function openProductModal() {
       if(currentPageProductId && window.ZWCHShop) {
           ZWCHShop.openBuyModal(currentPageProductId);
       }
    }
  </script>
